name: CI/CD Pipeline - Transportes La Solución

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Instalar dependencias del monorepo
      run: npm install

    - name: Compilar paquetes compartidos y aplicaciones
      run: npm run build

    - name: Ejecutar pruebas unitarias e integración (Vitest)
      run: npm test
